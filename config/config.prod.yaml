app:
  host: 0.0.0.0
  port: 8000
  log_level: INFO

documents:
  path: /app/documents
  supported_extensions:
    - .pdf
    - .txt
    - .docx
    - .md

chunking:
  chunk_size_tokens: 700
  overlap_tokens: 120
  min_chunk_tokens: 80

retrieval:
  top_k: 5
  dense_k: 8
  bm25_k: 8
  hybrid_alpha: 0.65
  rerank: true

context:
  max_chars: 6000

ollama:
  base_url: http://ollama:11434
  llm_model: qwen2.5:3b
  embedding_model: nomic-embed-text
  temperature: 0.1
  top_p: 0.9
  num_predict: 512
  timeout_seconds: 120

storage:
  metadata_backend: postgres
  vector_backend: qdrant
  chroma_path: /app/data/chroma
  sqlite_path: /app/data/state/index.db
  postgres_dsn: postgresql://rag:postgres@postgres:5432/rag
  cache_path: /app/data/cache
  qdrant_url: http://qdrant:6333
  qdrant_api_key: ""
  qdrant_collection_name: rag_chunks
  qdrant_timeout_seconds: 30

ingest:
  concurrent_files: 2

watch:
  enabled: false
  debounce_seconds: 2.0
