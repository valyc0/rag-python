services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0
    command: serve

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    depends_on:
      - ollama
    ports:
      - "${RAG_API_HOST_PORT:-8010}:8000"
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    volumes:
      - ./config:/app/config
      - ./documents:/app/documents
      - ./data:/app/data
    environment:
      RAG_CONFIG_PATH: /app/config/config.yaml
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_DOCUMENTS_PATH: /app/documents
      RAG_CHROMA_PATH: /app/data/chroma
      RAG_SQLITE_PATH: /app/data/state/index.db
      RAG_CACHE_PATH: /app/data/cache
      RAG_WATCH_ENABLED: "true"
    restart: unless-stopped

volumes:
  ollama_data:
