[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-python-engine"
version = "0.1.0"
description = "RAG Python Engine: local RAG system with Ollama, Chroma, FastAPI, and filesystem watching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.5,<0.7",
  "diskcache>=5.6.3,<6",
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "pydantic>=2.8.0,<3",
  "PyMuPDF>=1.24.9,<2",
  "python-docx>=1.1.2,<2",
  "PyYAML>=6.0.2,<7",
  "rank-bm25>=0.2.2,<0.3",
  "tenacity>=8.5.0,<9",
  "uvicorn[standard]>=0.30.6,<1",
  "watchdog>=5.0.2,<6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2,<9"
]

[project.scripts]
rag-cli = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
